<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 672" width="1024" height="672">
  <rect width="1024" height="672" fill="#000000"/>

  <!-- Title -->
  <text x="512" y="52" font-family="Georgia,serif" font-size="36" font-weight="bold" fill="#4ade80" text-anchor="middle">Height &amp; Depth</text>
  <text x="512" y="82" font-family="Arial,sans-serif" font-size="15" fill="#6b8c6b" text-anchor="middle">How tall — and how efficient — a tree is</text>

  <!-- Depth level dashed lines -->
  <line x1="110" y1="130" x2="890" y2="130" stroke="#1e3a2a" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="110" y1="295" x2="890" y2="295" stroke="#1e3a2a" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="110" y1="455" x2="890" y2="455" stroke="#1e3a2a" stroke-width="1" stroke-dasharray="5,5"/>

  <!-- Depth labels (left) -->
  <text x="88" y="135" font-family="Arial,sans-serif" font-size="14" fill="#4a7a5a" text-anchor="end">depth 0</text>
  <text x="88" y="300" font-family="Arial,sans-serif" font-size="14" fill="#4a7a5a" text-anchor="end">depth 1</text>
  <text x="88" y="460" font-family="Arial,sans-serif" font-size="14" fill="#4a7a5a" text-anchor="end">depth 2</text>

  <!-- Height bracket (right side) -->
  <line x1="870" y1="130" x2="870" y2="455" stroke="#c87030" stroke-width="2"/>
  <line x1="855" y1="130" x2="870" y2="130" stroke="#c87030" stroke-width="2"/>
  <line x1="855" y1="455" x2="870" y2="455" stroke="#c87030" stroke-width="2"/>
  <text x="890" y="298" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#c87030" text-anchor="start">height = 2</text>

  <!-- Edges -->
  <line x1="512" y1="130" x2="310" y2="295" stroke="#2a6a40" stroke-width="2.5"/>
  <line x1="512" y1="130" x2="714" y2="295" stroke="#2a6a40" stroke-width="2.5"/>
  <line x1="310" y1="295" x2="200" y2="455" stroke="#2a6a40" stroke-width="2.5"/>
  <line x1="310" y1="295" x2="424" y2="455" stroke="#2a6a40" stroke-width="2.5"/>

  <!-- Root node 50 (depth 0) — brighter -->
  <circle cx="512" cy="130" r="52" fill="#162c1e" stroke="#3ecf6f" stroke-width="3"/>
  <text x="512" y="138" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">50</text>

  <!-- Node 30 (depth 1) -->
  <circle cx="310" cy="295" r="46" fill="#162c1e" stroke="#3ecf6f" stroke-width="3"/>
  <text x="310" y="303" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">30</text>

  <!-- Node 70 (depth 1) -->
  <circle cx="714" cy="295" r="46" fill="#162c1e" stroke="#3ecf6f" stroke-width="3"/>
  <text x="714" y="303" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">70</text>

  <!-- Node 20 (depth 2, leaf — orange to highlight deepest) -->
  <circle cx="200" cy="455" r="46" fill="#1e1208" stroke="#c87030" stroke-width="3"/>
  <text x="200" y="463" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">20</text>

  <!-- Node 40 (depth 2, leaf — orange) -->
  <circle cx="424" cy="455" r="46" fill="#1e1208" stroke="#c87030" stroke-width="3"/>
  <text x="424" y="463" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">40</text>

  <!-- Body text -->
  <text x="512" y="548" font-family="Arial,sans-serif" font-size="15" fill="#8a9a8a" text-anchor="middle">Node 20's depth = 2 (two edges from root)</text>
  <text x="512" y="572" font-family="Arial,sans-serif" font-size="15" fill="#8a9a8a" text-anchor="middle">Tree height = 2 (longest root-to-leaf path)</text>

  <!-- Key insight -->
  <text x="512" y="618" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#4ade80" text-anchor="middle">Balanced tree with N nodes → height ≈ log₂(N). Unbalanced → height ≈ N.</text>
</svg>
